<script>
const AL=['','No interest — generic, forgettable','Some charm — a few nice details','Pleasant — clearly older, good bones','Distinctive — real character and period detail','Exceptional — genuinely memorable architecture'];
const LL=['','Very dark — few windows, north-facing','Below average — limited natural light','Decent light in main rooms','Bright and airy throughout','Exceptional — light-filled, great orientation'];
const CRITERIA=[
  {id:'t_stop',group:'Location',label:'Transit access',a:'Within 10-min walk of T stop',b:'10–20 min walk to T stop',c:'Within 10-min drive of commuter rail'},

  {id:'sys_roof',group:'Systems',label:'Roof',a:'Good 5+ years',b:'Good 2–5 years',c:'Needs replacement soon'},
  {id:'sys_elec',group:'Systems',label:'Electrical',a:'Good 5+ years',b:'Good 2–5 years',c:'Needs replacement soon'},
  {id:'sys_plumb',group:'Systems',label:'Plumbing',a:'Good 5+ years',b:'Good 2–5 years',c:'Needs replacement soon'},
  {id:'sys_siding',group:'Systems',label:'Siding',a:'Good 5+ years',b:'Good 2–5 years',c:'Needs replacement soon'},
  {id:'sys_windows',group:'Systems',label:'Windows',a:'Good 5+ years',b:'Good 2–5 years',c:'Needs replacement soon'},

  {id:'pre1940',group:'Character',label:'Age of home',a:'Built before 1940',b:'Built 1940–1960',c:'Built after 1960'},
  {id:'hoa',group:'Features',label:'HOA fee',a:'No HOA fee',b:'HOA under $300/mo',c:'HOA $300–$600/mo',d:'HOA over $600/mo',hasD:true},
  {id:'arch',group:'Character',label:'Architectural interest',type:'scale5',labels:AL},
  {id:'light',group:'Character',label:'Natural light',type:'scale5',labels:LL},
];
const DEFAULT_W={t_stop:8,portsmouth:7,walkable:8,restaurants:5,nature:5,price:9,sqft:6,type:7,bedrooms:7,ensuite:6,ceiling:6,storage:8,workshop:6,fenced:6,move_in:7,ac:5,sys_roof:5,sys_elec:5,sys_plumb:5,sys_siding:3,sys_windows:3,sys_hvac:5,pre1940:6,hoa:7,arch:7,light:7};

// ── GitHub Gist persistent storage ───────────────────────────────────────
const GIST_ID='22bc628d7e6700e2fc9aea07d6f70ee5';
const GIST_FILE='hev-data.json';

function _gistToken(){return localStorage.getItem('hev_gist_token')||'';}

let _gistCache=null;

async function _gistLoad(){
  if(_gistCache)return _gistCache;
  try{
    const r=await fetch('https://api.github.com/gists/'+GIST_ID,{headers:{'Accept':'application/vnd.github+json'}});
    if(r.ok){
      const g=await r.json();
      const content=g.files&&g.files[GIST_FILE]&&g.files[GIST_FILE].content;
      if(content){_gistCache=JSON.parse(content);return _gistCache;}
    }
  }catch(e){}
  _gistCache={};
  return _gistCache;
}

let _saveTimer=null;

async function serverGet(key){
  try{
    const state=await _gistLoad();
    if(key in state)return state[key];
  }catch(e){}
  try{return localStorage.getItem(key);}catch(e){return null;}
}

async function serverSet(key,val){
  try{
    const state=await _gistLoad();
    state[key]=val;
    clearTimeout(_saveTimer);
    _saveTimer=setTimeout(async()=>{
      const token=_gistToken();
      if(!token)return;
      try{
        await fetch('https://api.github.com/gists/'+GIST_ID,{
          method:'PATCH',
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'},
          body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(_gistCache)}}})
        });
      }catch(e){}
    },500);
  }catch(e){}
  try{localStorage.setItem(key,val);}catch(e){}
}

let lastImportJson=null;
let jsonPanelOpen=false;
function saveLastJson(json){lastImportJson=json;serverSet('hev_last_json',json);}

let weights={...DEFAULT_W};
let listings=[];
let locPrefs={};
let locWeight=8;
let activeTab='dashboard';
let expanded=null;

async function saveWeights(){await serverSet('hev_weights',JSON.stringify(weights));}
async function saveListings(){await serverSet('hev_listings',JSON.stringify(listings));}
async function saveLocPrefs(){await serverSet('hev_locprefs',JSON.stringify(locPrefs));}
async function saveLocWeight(v){locWeight=+v;await serverSet('hev_locweight',String(v));}

async function withTimeout(promise, ms=5000){
  return Promise.race([promise, new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),ms))]);
}

async function loadAllState(){
  // One Gist fetch, then extract all keys from it
  let gist={};
  try{
    gist=await withTimeout(_gistLoad(),5000);
  }catch(e){
    console.warn('Gist load failed:', e.message);
  }

  function g(key){
    // Prefer Gist, fall back to localStorage
    const v=gist[key];
    if(v!==undefined&&v!==null)return v;
    try{return localStorage.getItem(key);}catch(e){return null;}
  }

  const wRaw=g('hev_weights');
  const lRaw=g('hev_listings');
  const ljRaw=g('hev_last_json');
  const lpRaw=g('hev_locprefs');
  const lwRaw=g('hev_locweight');

  if(wRaw){try{const p=JSON.parse(wRaw);Object.keys(p).forEach(k=>{if(k in weights)weights[k]=+p[k];});}catch(e){}}
  if(lRaw){try{listings=JSON.parse(lRaw).map(l=>{if(!l.name&&l.address){l.name=l.address;delete l.address;}return l;});}catch(e){}}
  if(ljRaw){lastImportJson=ljRaw;}
  if(lpRaw){try{locPrefs=JSON.parse(lpRaw);}catch(e){}}
  if(lwRaw){locWeight=+lwRaw;}
}

function extractTown(name){
  if(!name)return null;
  const m=name.match(/,\s*([^,]+?)\s+MA\s*$/i);
  if(!m)return null;
  return m[1].trim();
}

function syncLocPrefs(){
  listings.forEach(l=>{
    const town=extractTown(l.name);
    if(town&&!locPrefs[town]){
      locPrefs[town]={name:town,rating:null};
    }
  });
  saveLocPrefs();
}

function locScore(l){
  const town=extractTown(l.name);
  if(!town)return null;
  const pref=locPrefs[town];
  if(!pref||pref.rating===null)return null;
  return(pref.rating-1)/4;
}

function newListing(o={}){const scores={};CRITERIA.forEach(c=>scores[c.id]=c.type==='scale5'?0:'unknown');return{name:'',url:'',scores,notes:'',lat:null,lng:null,gut:null,...o};}
function multiplier(s,c){if(c.type==='scale5')return s&&s>0?(s-1)/4:null;if(s==='a')return 1;if(s==='b')return 0.5;if(s==='c')return c.noC?null:0.25;if(s==='d')return c.hasD?0:null;return null;}
function pointsEarned(s,c){const m=multiplier(s,c);return m===null?null:+(m*weights[c.id]).toFixed(2);}
function getScore(l){
  let total=0,max=0;
  CRITERIA.forEach(c=>{const pts=pointsEarned(l.scores[c.id],c);if(pts!==null){total+=pts;max+=weights[c.id];}});
  const ls=locScore(l);
  if(ls!==null){total+=ls*locWeight;max+=locWeight;}
  const n=Object.values(l.scores).filter(v=>v&&v!=='unknown'&&v!==0).length;
  return n<6?null:Math.round((total/max)*100);
}
function badge(sc){if(sc===null)return'<span class="score-badge s-na">—</span>';return`<span class="score-badge ${sc>=70?'s-hi':sc>=45?'s-md':'s-lo'}">${sc}%</span>`;}
function barColor(s){return s>=70?'#1D9E75':s>=45?'#BA7517':'#E24B4A';}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function cellBg(pts,maxPts,isDZero){
  if(pts===null)return{bg:'#f9f9f9',text:'#bbb'};
  if(isDZero)return{bg:'#2d0a0a',text:'#ffb3b3'};
  const r=maxPts>0?pts/maxPts:0;
  if(r>=1)return{bg:'#EAF3DE',text:'#27500A'};
  if(r>=0.65)return{bg:'#E1F5EE',text:'#085041'};
  if(r>=0.4)return{bg:'#FAEEDA',text:'#633806'};
  if(r>=0.15)return{bg:'#FAECE7',text:'#712B13'};
  return{bg:'#FCEBEB',text:'#791F1F'};
}
function totalBg(sc){if(sc===null)return{bg:'#f9f9f9',text:'#bbb'};if(sc>=70)return{bg:'#EAF3DE',text:'#27500A'};if(sc>=50)return{bg:'#FAEEDA',text:'#633806'};return{bg:'#FCEBEB',text:'#791F1F'};}

let mapInstance = null;
let mapMarkers = [];
let geocodeCache = {};
let selectedMapListing = null;

function scoreColor(sc) {
  if (sc === null) return '#aaa';
  if (sc >= 70) return '#1D9E75';
  if (sc >= 45) return '#BA7517';
  return '#E24B4A';
}

function cleanAddressForGeocoding(name) {
  let a = name.replace(/#[\w\d]+/gi, '').replace(/\bunit\s+[\w\d]+/gi, '');
  a = a.replace(/\bDorchester\b/gi, 'Boston').replace(/\bJamaica Plain\b/gi, 'Boston');
  a = a.replace(/\b(Chablis|Tuscan|Falcon|Cardinal|Mallard|Salerno|Abbeyville)\s+Plan\b/gi, '');
  a = a.replace(/,\s*,/g, ',').replace(/\s+/g, ' ').trim().replace(/^,|,$/g, '').trim();
  return a;
}

async function geocodeAddress(name) {
  if (geocodeCache[name]) return geocodeCache[name];
  const cleaned = cleanAddressForGeocoding(name);
  const q = encodeURIComponent(cleaned + ', MA, USA');
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?q=' + q + '&format=json&limit=1', {
      headers: { 'Accept-Language': 'en', 'User-Agent': 'HouseEvaluator/1.0' }
    });
    const d = await r.json();
    if (d && d.length > 0) {
      const coords = [parseFloat(d[0].lat), parseFloat(d[0].lon)];
      geocodeCache[name] = coords;
      serverSet('hev_geocache', JSON.stringify(geocodeCache));
      return coords;
    }
    const parts = cleaned.split(',');
    if (parts.length >= 2) {
      const q2 = encodeURIComponent(parts[0].trim() + ', ' + parts[parts.length-1].trim() + ', MA, USA');
      await new Promise(res => setTimeout(res, 1100));
      const r2 = await fetch('https://nominatim.openstreetmap.org/search?q=' + q2 + '&format=json&limit=1', {
        headers: { 'Accept-Language': 'en', 'User-Agent': 'HouseEvaluator/1.0' }
      });
      const d2 = await r2.json();
      if (d2 && d2.length > 0) {
        const coords = [parseFloat(d2[0].lat), parseFloat(d2[0].lon)];
        geocodeCache[name] = coords;
        serverSet('hev_geocache', JSON.stringify(geocodeCache));
        return coords;
      }
    }
  } catch(e) {}
  return null;
}

  tab.innerHTML = `
    <div id="map-container">

      </div>
    </div>

    <div id="map-list-bar" style="padding:12px 16px;background:#fff;border-top:1px solid #f0f0f0;overflow-x:auto;white-space:nowrap;display:flex;gap:8px;-webkit-overflow-scrolling:touch">

async function plotListings() {
  const sorted = [...listings].map((l,i) => ({...l, _i:i, sc:getScore(l)}))
    .sort((a,b) => (b.sc||0)-(a.sc||0));

  const bar = document.getElementById('map-list-bar');
  if (bar) {
    bar.innerHTML = sorted.map((l,rank) => {
      const sc = l.sc;
      const bg = scoreColor(sc);
      return `<div onclick="focusMapListing(${l._i})" id="mapbar-${l._i}"
        style="display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid #eee;border-radius:20px;cursor:pointer;flex-shrink:0;background:#fff;-webkit-tap-highlight-color:transparent">
        <div style="width:22px;height:22px;border-radius:50%;background:${bg};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff">${rank+1}</div>
        <span style="font-size:12px;font-weight:500;max-width:120px;overflow:hidden;text-overflow:ellipsis">${esc(l.name.split(',')[0])}</span>
        ${sc!==null?`<span style="font-size:11px;font-weight:500;color:${bg}">${sc}%</span>`:''}
      </div>`;
    }).join('');
  }

  const bounds = [];
  for (let i = 0; i < sorted.length; i++) {
    const l = sorted[i];
    const rank = i + 1;
    let coords = (l.lat && l.lng) ? [l.lat, l.lng] : (geocodeCache[l.name] || null);
    if (!coords) {
      const statusEl = document.getElementById('geocode-status');
      if (statusEl) { statusEl.style.display='block'; statusEl.textContent = 'Locating ' + (i+1) + ' of ' + sorted.length + ': ' + l.name.split(',')[0] + '…'; }
      if (i > 0) await new Promise(r => setTimeout(r, 1100));
      coords = await geocodeAddress(l.name);
    }
    if (coords && !l.lat) {
      listings[l._i].lat = coords[0];
      listings[l._i].lng = coords[1];
      saveListings();
    }
    if (!coords) continue;
    bounds.push(coords);

    const sc = l.sc;
    const bg = scoreColor(sc);
    const label = sc !== null ? sc + '%' : '?';

    const icon = L.divIcon({
      className: '',
      html: `<div style="width:42px;height:42px;border-radius:50%;background:${bg};border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer">
        <span style="font-size:9px;font-weight:700;color:#fff;line-height:1">#${rank}</span>
        <span style="font-size:9px;font-weight:600;color:#fff;line-height:1">${label}</span>
      </div>`,
      iconSize: [42, 42],
      iconAnchor: [21, 21],
      popupAnchor: [0, -24]
    });

    const marker = L.marker(coords, {icon}).addTo(mapInstance);
    marker._listingIdx = l._i;
    marker.on('click', () => showMapPanel(l._i));
    mapMarkers.push({idx: l._i, marker, coords});
  }

  const statusEl = document.getElementById('geocode-status');
  if (statusEl) statusEl.style.display = 'none';
  if (bounds.length > 1) mapInstance.fitBounds(bounds, {padding: [40, 40]});
  else if (bounds.length === 1) mapInstance.setView(bounds[0], 14);
}

function showMapPanel(idx) {
  selectedMapListing = idx;
  const l = listings[idx];
  const sc = getScore(l);
  const bg = scoreColor(sc);
  const panel = document.getElementById('map-panel');
  const content = document.getElementById('map-panel-content');
  if (!panel || !content) return;

  const topCrit = CRITERIA
    .filter(c => { const v = l.scores[c.id]; return v && v !== 'unknown' && v !== 0; })
    .sort((a,b) => weights[b.id] - weights[a.id])
    .slice(0, 6);

  let critHtml = topCrit.map(c => {
    const s = l.scores[c.id];
    let lbl = '—', col = '#aaa';
    if (c.type === 'scale5') { if (s > 0) { lbl = s+'/5'; col = s >= 4 ? '#1D9E75' : s >= 3 ? '#BA7517' : '#E24B4A'; }}
    else { if(s==='a'){lbl='✓';col='#1D9E75';}else if(s==='b'){lbl='~';col='#BA7517';}else if(s==='c'){lbl='✗';col='#E24B4A';} }
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f5f5f5">
      <span style="font-size:12px;color:#666">${c.label}</span>
      <span style="font-size:12px;font-weight:500;color:${col}">${lbl}</span>
    </div>`;
  }).join('');

  content.innerHTML = `
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px">
      <div>
        <div style="font-size:15px;font-weight:500">${esc(l.name)}</div>
        ${l.url ? `<a href="${esc(l.url)}" target="_blank" style="font-size:12px;font-weight:500;color:#2563eb;text-decoration:none;white-space:nowrap">View on Redfin ↗</a>` : ''}
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:12px">
        ${badge(sc)}
        <button onclick="closeMapPanel()" style="background:none;border:none;font-size:20px;color:#aaa;cursor:pointer;padding:0 4px;line-height:1">×</button>
      </div>
    </div>
    <div style="margin-bottom:10px">${critHtml}</div>
    <button class="btn btn-sm" onclick="goEdit(${idx})" style="width:100%">Edit scores</button>
  `;
  panel.classList.add('open');

  document.querySelectorAll('[id^=mapbar-]').forEach(el => {
    el.style.borderColor = el.id === 'mapbar-'+idx ? '#1a1a1a' : '#eee';
    el.style.borderWidth = el.id === 'mapbar-'+idx ? '1.5px' : '1px';
  });
}

function closeMapPanel() {
  const panel = document.getElementById('map-panel');
  if (panel) panel.classList.remove('open');
  selectedMapListing = null;
  document.querySelectorAll('[id^=mapbar-]').forEach(el => {
    el.style.borderColor = '#eee';
    el.style.borderWidth = '1px';
  });
}

function focusMapListing(idx) {
  const m = mapMarkers.find(m => m.idx === idx);
  if (m && mapInstance) {
    mapInstance.setView(m.coords, 15, {animate: true});
    showMapPanel(idx);
  }
}

function exportData(){
  const data={listings,weights,geocodeCache,locPrefs,locWeight};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='house-evaluator-data-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importDataFile(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      const el=document.getElementById('data-status');
      if(data.listings&&Array.isArray(data.listings)){
        listings=data.listings;
        saveListings();
      }
      if(data.weights&&typeof data.weights==='object'){
        Object.keys(data.weights).forEach(k=>{if(k in weights)weights[k]=+data.weights[k];});
        saveWeights();
      }
      if(data.geocodeCache&&typeof data.geocodeCache==='object'){
        geocodeCache=data.geocodeCache;
        serverSet('hev_geocache',JSON.stringify(geocodeCache));
      }
      if(data.locPrefs&&typeof data.locPrefs==='object'){
        locPrefs=data.locPrefs;
        saveLocPrefs();
      }
      if(data.locWeight!==undefined){
        locWeight=+data.locWeight;
        saveLocWeight(locWeight);
      }
      if(el)el.textContent=`Loaded ${listings.length} listings from ${file.name}`;
      renderListings();
    }catch(err){
      const el=document.getElementById('data-status');
      if(el){el.style.color='#c0392b';el.textContent='Could not read file: '+err.message;}
    }
  };
  reader.readAsText(file);
}

function renderInsights(){
  const el=document.getElementById('tab-insights');
  const rated=listings.filter(l=>l.gut!==null&&l.gut!==undefined);
  if(rated.length<2){
    el.innerHTML=`<div class="empty">Rate at least 2 listings with a gut score (in the Listings tab) to get insights.</div>`;
    return;
  }

  const gutNorm=rated.map(l=>((l.gut-1)/9)*100);
  const calcScores=rated.map(l=>getScore(l)||0);

  function corr(xs,ys){
    const n=xs.length;
    const mx=xs.reduce((a,b)=>a+b,0)/n;
    const my=ys.reduce((a,b)=>a+b,0)/n;
    const num=xs.reduce((s,x,i)=>s+(x-mx)*(ys[i]-my),0);
    const den=Math.sqrt(xs.reduce((s,x)=>s+(x-mx)**2,0)*ys.reduce((s,y)=>s+(y-my)**2,0));
    return den===0?0:num/den;
  }

  const overallCorr=corr(gutNorm,calcScores);
  const overallGap=rated.map((l,i)=>gutNorm[i]-calcScores[i]);

  const critStats=CRITERIA.map(c=>{
    const pts=rated.map(l=>{
      const p=pointsEarned(l.scores[c.id],c);
      return p===null?null:p/weights[c.id];
    });
    const paired=pts.map((p,i)=>[p,gutNorm[i]]).filter(([p])=>p!==null);
    if(paired.length<2)return{...c,r:null,weight:weights[c.id],avgPts:null};
    const r=corr(paired.map(p=>p[0]),paired.map(p=>p[1]));
    const avgPts=paired.reduce((s,p)=>s+p[0],0)/paired.length;
    return{...c,r,weight:weights[c.id],avgPts};
  }).filter(x=>x.r!==null).sort((a,b)=>b.r-a.r);

  const overWeighted=critStats.filter(c=>c.weight>=6&&c.r<0.2).sort((a,b)=>a.r-b.r).slice(0,3);
  const underWeighted=critStats.filter(c=>c.weight<=5&&c.r>0.5).sort((a,b)=>b.r-a.r).slice(0,3);

  const gaps=rated.map((l,i)=>({name:l.name,gut:gutNorm[i],calc:calcScores[i],gap:gutNorm[i]-calcScores[i],gutRaw:l.gut}))
    .sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap));

  let html=`<div style="margin-bottom:1.5rem">
    <div style="font-size:14px;font-weight:500;margin-bottom:4px">Overall alignment</div>
    <div style="font-size:13px;color:#666;margin-bottom:10px;line-height:1.5">Based on ${rated.length} rated listing${rated.length!==1?'s':''}. Model vs. gut correlation: <strong>${(overallCorr*100).toFixed(0)}%</strong>${overallCorr>0.7?' — strong alignment':overallCorr>0.4?' — moderate alignment':' — weak alignment, adjustments recommended'}.</div>
  </div>`;

  html+=`<div style="margin-bottom:1.5rem">
    <div style="font-size:12px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px">Gut vs calculated score</div>`;
  const gapSorted=[...gaps].sort((a,b)=>b.gut-a.gut);
  gapSorted.forEach(l=>{
    const gutW=Math.round(l.gut);
    const calcW=Math.round(l.calc);
    const gutColor='#2563eb';
    const calcColor=l.calc>=70?'#1D9E75':l.calc>=45?'#BA7517':'#E24B4A';
    const name=l.name.split(',')[0];
    html+=`<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
        <span style="color:#1a1a1a;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%">${esc(name)}</span>
        <span style="font-size:11px;color:#888;flex-shrink:0">gut ${l.gutRaw}/10 · calc ${calcW}%</span>
      </div>
      <div style="position:relative;height:8px;background:#f0f0f0;border-radius:4px;margin-bottom:2px">
        <div style="position:absolute;left:0;top:0;height:8px;border-radius:4px;background:${gutColor};opacity:.35;width:${gutW}%"></div>
        <div style="position:absolute;left:0;top:0;height:8px;border-radius:4px;background:${calcColor};width:${calcW}%"></div>
      </div>
      <div style="display:flex;gap:8px;font-size:10px;color:#aaa">
        <span><span style="color:${gutColor};opacity:.7">■</span> gut</span>
        <span><span style="color:${calcColor}">■</span> calculated</span>
        ${Math.abs(l.gap)>15?`<span style="color:${l.gap>0?'#2563eb':'#BA7517'}">${l.gap>0?'↑ you rate higher':'↓ you rate lower'} than model</span>`:''}
      </div>
    </div>`;
  });
  html+='</div>';

  html+=`<div style="margin-bottom:1.5rem">
    <div style="font-size:12px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px">How well each criterion predicts your gut score</div>
    <div style="font-size:11px;color:#aaa;margin-bottom:10px">Longer bar = stronger predictor of what you actually like. Color = current weight.</div>`;
  const maxCorr=Math.max(...critStats.map(x=>Math.abs(x.r)),0.01);
  critStats.forEach(cs=>{
    const pct=Math.round((cs.r/maxCorr)*100);
    const barW=Math.max(0,pct);
    const bColor=cs.r>=0.5?'#1D9E75':cs.r>=0.2?'#BA7517':'#E24B4A';
    const weightColor=cs.weight>=7?'#1a1a1a':cs.weight>=4?'#888':'#bbb';
    html+=`<div style="margin-bottom:7px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">

        <div style="height:6px;border-radius:3px;background:${bColor};width:${barW}%"></div>
      </div>
    </div>`;
  });
  html+='</div>';

  if(overWeighted.length||underWeighted.length){
    html+=`<div style="background:#f9f9f9;border:1px solid #eee;border-radius:12px;padding:14px;margin-bottom:1rem">
      <div style="font-size:13px;font-weight:500;margin-bottom:10px">Suggested weight adjustments</div>`;
    if(overWeighted.length){
      html+=`<div style="font-size:12px;font-weight:500;color:#BA7517;margin-bottom:6px">Consider reducing weight:</div>`;
      overWeighted.forEach(cs=>{
        html+=`<div style="font-size:12px;color:#666;margin-bottom:5px;padding-left:10px">
          <strong>${cs.label}</strong> (currently ${cs.weight}) — low correlation with your ratings (r=${cs.r.toFixed(2)}). You may care less about this than you thought.
        </div>`;
      });
    }
    if(underWeighted.length){
      html+=`<div style="font-size:12px;font-weight:500;color:#1D9E75;margin-top:8px;margin-bottom:6px">Consider increasing weight:</div>`;
      underWeighted.forEach(cs=>{
        html+=`<div style="font-size:12px;color:#666;margin-bottom:5px;padding-left:10px">
          <strong>${cs.label}</strong> (currently ${cs.weight}) — strong predictor of what you like (r=+${cs.r.toFixed(2)}). This may matter more than your current weight suggests.
        </div>`;
      });
    }
    html+=`<div style="font-size:11px;color:#aaa;margin-top:10px">Note: these suggestions are based on only ${rated.length} rated listings. Rate more listings for better accuracy.</div>
    </div>`;
  }

  el.innerHTML=html;
}

function copyLastJson(){
  if(!lastImportJson)return;
  navigator.clipboard.writeText(lastImportJson).then(()=>{
    const btn=document.querySelector('.json-copy-btn');
    if(btn){btn.textContent='Copied!';setTimeout(()=>{btn.textContent='Copy to clipboard';},2000);}

const TAB_ORDER=['listings','map','weights','insights','location','data'];
const TAB_LABELS={listings:'Listings',map:'Map',weights:'Weights',insights:'Insights',location:'Locations',data:'Data'};

function tabNeedsAttention(t){
  if(t==='listings'){
    return listings.some(l=>l.gut===null||l.gut===undefined);
  }
  if(t==='location'){
    syncLocPrefs();
    return Object.values(locPrefs).some(p=>p.rating===null);
  }
  return false;
}

function renderTabs(){
  const container=document.getElementById('main-tabs');
  if(!container)return;
  container.innerHTML=TAB_ORDER.map(t=>{

    return `<button class="tab${activeTab===t?' active':''}" onclick="showTab('${t}')">${TAB_LABELS[t]}${dot}</button>`;
  }).join('');
}

function setLocRating(town,val){
  if(!locPrefs[town])locPrefs[town]={name:town,rating:null};

  renderTabs();

  if(activeTab==='listings')renderListings();
}

function handleHtmlUpload(input){
  const files=Array.from(input.files);
  if(!files.length)return;
  const listEl=document.getElementById('upload-file-list');
  const zoneEl=document.getElementById('upload-zone');
  const labelEl=document.getElementById('upload-label');
  labelEl.textContent=`${files.length} file${files.length!==1?'s':''} selected`;
  zoneEl.style.borderStyle='solid';zoneEl.style.borderColor='#97C459';zoneEl.style.background='#f6fbef';
  let html='';
  let pending=files.length;
  const results=[];
  files.forEach((file,i)=>{
    results.push({name:file.name,text:''});
    const reader=new FileReader();
    reader.onload=e=>{
      const tmp=document.createElement('div');
      tmp.innerHTML=e.target.result;
      tmp.querySelectorAll('script,style,noscript,nav,footer,header,svg,iframe').forEach(el=>el.remove());
      const raw=(tmp.innerText||tmp.textContent||'').replace(/\s+/g,' ').trim();
      results[i].text=raw.slice(0,8000);
      results[i].words=Math.round(raw.length/5);
      pending--;
      if(pending===0){
        let listHtml='';
        results.forEach(r=>{
          listHtml+=`<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#444;padding:4px 0;border-bottom:1px solid #f0f0f0">
            <span style="color:#1D9E75;font-size:14px">✓</span>
            <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span>
            <span style="color:#aaa;flex-shrink:0">~${r.words} words</span>
          </div>`;
        });
        document.getElementById('upload-file-list').innerHTML=listHtml;
        window._uploadedListingTexts=results;
      }
    };
    reader.readAsText(file);
  });
}

function importScores(){
  const raw=document.getElementById('import-json').value.trim();
  const el=document.getElementById('import-status');
  if(!raw){el.className='import-status err';el.textContent='Paste JSON first.';return;}
  let data;
  try{data=JSON.parse(raw.replace(/```json|```/g,'').trim());}catch(e){el.className='import-status err';el.textContent='Invalid JSON.';return;}
  if(!Array.isArray(data))data=[data];
  let added=0,updated=0;
  data.forEach(item=>{
    const scores={};CRITERIA.forEach(c=>scores[c.id]=c.type==='scale5'?0:'unknown');
    if(item.scores)Object.assign(scores,item.scores);
    const idx=listings.findIndex(l=>l.name&&item.name&&l.name.toLowerCase()===item.name.toLowerCase());
    if(idx>=0){listings[idx].scores=scores;if(item.url)listings[idx].url=item.url;updated++;}
    else{listings.push(newListing({name:item.name||'',url:item.url||'',scores}));added++;}
  });
  const KNOWN_COORDS = {
    '110 melville ave #1, dorchester ma': [42.3078, -71.0724],
    '11 wyman st unit 2b, jamaica plain ma': [42.3189, -71.1063],
    'chablis plan, walpole ma': [42.1487, -71.2495],
    '24 coach rd, south easton ma': [42.0201, -71.0867],
    '12 jasper ln #12, randolph ma': [42.1668, -71.0445],
    '7 mildred st, hull ma': [42.2990, -70.8937],
    '90 florian st, jamaica plain ma': [42.3119, -71.1198],
    '38 saint gregory #38, boston ma': [42.2962, -71.0695],
  };
  listings.forEach((l,i) => {
    if (!l.lat) {
      const key = l.name.toLowerCase().trim();
      if (KNOWN_COORDS[key]) { listings[i].lat = KNOWN_COORDS[key][0]; listings[i].lng = KNOWN_COORDS[key][1]; }
    }
  });
  saveListings();
  lastImportJson=raw;
  saveLastJson(raw);
  el.className='import-status ok';el.textContent=`Imported ${added} new, updated ${updated} existing.`;
  renderTabs();
  renderListings();
}

function renderMatrix(){
  if(!listings.length){document.getElementById('tab-matrix').innerHTML='<div class="empty">Import some listings first to see the matrix.</div>';return;}
  const sorted=[...listings].map((l,i)=>({...l,_i:i,sc:getScore(l)})).sort((a,b)=>(b.sc||0)-(a.sc||0));
  const groups=[...new Set(CRITERIA.map(c=>c.group))];
  const n = sorted.length;
  const factorPct = Math.round(140 / 7 * 100) / 100;
  const listingPct = ((100 - factorPct) / n).toFixed(2);
  const colDefs = `<col style="width:${factorPct}%">` + sorted.map(()=>`<col style="width:${listingPct}%">`).join('');
  let html=`<div class="mx-wrap"><table class="mx-table"><colgroup>${colDefs}</colgroup><thead><tr><th class="mx-corner">Criterion</th>`;
  sorted.forEach(l=>{const parts=l.name.split(/[,\n]/);html+=`<th class="mx-listing-th">${esc(parts[0]||l.name)}<br><span style="font-size:10px;color:#888;font-weight:400">${esc((parts[1]||'').trim())}</span></th>`;});
  html+=`</tr></thead><tbody>`;
  groups.forEach(g=>{
    html+=`<tr class="mx-group-row"><td colspan="${sorted.length+1}">${g}</td></tr>`;
    CRITERIA.filter(c=>c.group===g).forEach(c=>{
      const maxPts=weights[c.id];
      html+=`<tr><td class="mx-factor">${c.label}<span class="mx-wt">(${maxPts})</span></td>`;
      sorted.forEach(l=>{
        const s=l.scores[c.id];const pts=pointsEarned(s,c);
        const col=cellBg(pts,maxPts,s==='d'&&c.hasD);
        const disp=pts===null?'—':pts===Math.round(pts)?String(Math.round(pts)):pts.toFixed(1);
        html+=`<td class="mx-cell" style="background:${col.bg};color:${col.text}">${disp}</td>`;
      });
      html+='</tr>';
    });
  });
  html+=`<tr><td class="mx-subrow-label">Points scored / max scored</td>`;
  sorted.forEach(l=>{let t=0,m=0;CRITERIA.forEach(c=>{const p=pointsEarned(l.scores[c.id],c);if(p!==null){t+=p;m+=weights[c.id];}});html+=`<td class="mx-subrow-cell">${Math.round(t)} / ${Math.round(m)}</td>`;});
  html+=`</tr><tr><td class="mx-total-label">Overall score</td>`;
  sorted.forEach(l=>{const sc=getScore(l);const col=totalBg(sc);html+=`<td class="mx-total-cell" style="background:${col.bg};color:${col.text}">${sc!==null?sc+'%':'—'}</td>`;});
  html+=`</tr></tbody></table><div class="legend">
    <div class="legend-item"><div class="legend-swatch" style="background:#EAF3DE"></div>Full pts</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#E1F5EE"></div>65–99%</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#FAEEDA"></div>40–64%</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#FAECE7"></div>15–39%</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#FCEBEB"></div>0–14%</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#f9f9f9;border:1px solid #eee"></div>Unknown</div>
  </div></div>`;
  document.getElementById('tab-matrix').innerHTML=html;
}

function renderListings(){
  const container=document.getElementById('tab-listings');
  const indexed=listings.map((l,i)=>({l,i}));
  const sorted=[...indexed].sort((a,b)=>(getScore(b.l)||0)-(getScore(a.l)||0));
  const filtered=listingsFilterUnscored
    ? sorted.filter(({l})=>l.gut===null||l.gut===undefined)
    : sorted;
  const unratedCount=listings.filter(l=>l.gut===null||l.gut===undefined).length;

  let html=`<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:1rem">
    <span style="font-size:13px;color:#888">${listings.length} listing${listings.length!==1?'s':''}</span>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#444;cursor:pointer;-webkit-tap-highlight-color:transparent">
        <input type="checkbox" ${listingsFilterUnscored?'checked':''} onchange="listingsFilterUnscored=this.checked;renderListings()" style="width:16px;height:16px;cursor:pointer">
        No gut score only${unratedCount?` <span style="color:#E24B4A">(${unratedCount})</span>`:''}
      </label>
      <button class="btn btn-sm" onclick="toggleAllListings()">Collapse all</button>
      <button class="btn" onclick="addListing()">+ Add listing</button>
    </div>
  </div>`;

  if(!filtered.length){
    html+=`<div class="empty">${listingsFilterUnscored?'All listings have a gut score set.':'No listings yet. Go to the Data tab to import listings.'}</div>`;
  }

  filtered.forEach(({l,i:li},rank)=>{
    const sc=getScore(l);
    const scoredN=CRITERIA.filter(c=>{const v=l.scores[c.id];return v&&v!=='unknown'&&v!==0;}).length;
    const gut=l.gut!==null&&l.gut!==undefined?l.gut:null;
    const collapsed=listingsCollapsed[li]===undefined?true:!!listingsCollapsed[li];

    html+=`<div class="${collapsed?'lcard':'card'}" id="lc-${li}" style="${collapsed?'cursor:default':''}">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="rank-num${rank===0?' top':''}" style="flex-shrink:0">${rank+1}</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span style="font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%">${esc(l.name)||'Unnamed'}</span>
            ${badge(sc)}
            ${gut!==null?`<span id="gut-hdr-${li}" style="font-size:12px;font-weight:500;background:#f5f5f5;padding:2px 8px;border-radius:6px">gut: ${gut}/10</span>`:`<span id="gut-hdr-${li}" style="display:none;font-size:12px;font-weight:500;background:#f5f5f5;padding:2px 8px;border-radius:6px"></span>`}
          </div>
          ${l.url?`<div style="margin-top:2px"><a href="${esc(l.url)}" target="_blank" style="font-size:12px;font-weight:500;color:#2563eb;text-decoration:none;white-space:nowrap">View on Redfin ↗</a></div>`:''}
          <div style="display:flex;align-items:center;gap:8px;margin-top:5px">
            <div class="bar-bg"><div class="bar-fill" style="width:${sc||0}%;background:${sc?barColor(sc):'#ddd'}"></div></div>
            <span style="font-size:11px;color:#aaa;white-space:nowrap">${scoredN}/${CRITERIA.length} criteria filled</span>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:4px;flex-shrink:0">
          <button onclick="listingsCollapsed[${li}]=!listingsCollapsed[${li}];renderListings()" style="background:none;border:none;cursor:pointer;font-size:14px;color:#aaa;padding:4px;-webkit-tap-highlight-color:transparent">${collapsed?'▼':'▲'}</button>
          <button class="del-btn" onclick="delListing(${li})" style="padding:4px 6px">✕</button>
        </div>
      </div>`;

    if(!collapsed){
      html+=`<div style="padding:10px 0;border-top:1px solid ${gut===null?'#E24B4A44':'#f0f0f0'};border-bottom:1px solid #f0f0f0;margin-bottom:12px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-size:13px;font-weight:500">My gut score</span>
            ${gut===null?'<span class="tab-dot" style="margin-left:0"></span>':''}
          </div>
          <span style="font-size:13px;font-weight:500;color:${gut===null?'#E24B4A':'#1a1a1a'}" id="gut-val-${li}">${gut!==null?gut+'/10':'not set'}</span>
        </div>
        <input type="range" min="1" max="10" step="1" value="${gut||5}"
          style="width:100%;height:36px;cursor:pointer"
          oninput="listings[${li}].gut=+this.value;document.getElementById('gut-val-${li}').textContent=this.value+'/10';const hb=document.getElementById('gut-hdr-${li}');if(hb){hb.textContent='gut: '+this.value+'/10';hb.style.display='';}saveListings();renderTabs();if(listingsFilterUnscored){clearTimeout(window._gutFilterTimer);window._gutFilterTimer=setTimeout(()=>renderListings(),3000);}else ddb()">
        <div style="display:flex;justify-content:space-between;font-size:10px;color:#bbb;margin-top:2px"><span>1 — not for me</span><span>10 — perfect</span></div>
      </div>`;

      html+=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:12px">
        <svg width="13" height="13" viewBox="0 0 12 12" fill="none" style="flex-shrink:0"><path d="M6 1a3.5 3.5 0 0 1 3.5 3.5C9.5 7.5 6 11 6 11S2.5 7.5 2.5 4.5A3.5 3.5 0 0 1 6 1z" stroke="#aaa" stroke-width="1" fill="none"/><circle cx="6" cy="4.5" r="1" fill="#aaa"/></svg>
        <input class="url-input" placeholder="Paste Zillow or Redfin URL…" value="${esc(l.url||'')}" oninput="listings[${li}].url=this.value;saveListings()">
      </div>`;

      const groups=[...new Set(CRITERIA.map(c=>c.group))];
      groups.forEach(g=>{
        html+=`<div class="subsection-label">${g}</div><div class="crit-grid">`;
        CRITERIA.filter(c=>c.group===g).forEach(c=>{
          if(c.type==='scale5'){
            const v=l.scores[c.id]||0;
            html+=`<div class="arch-cell" style="grid-column:1/-1">
              <div class="arch-label">${c.label}</div>
              <div class="arch-stars">`;
            [1,2,3,4,5].forEach(n=>{
              html+=`<button class="star-btn${v>=n?' filled':''}" onclick="doStar(${li},'${c.id}',${n})">${v>=n?'★':'☆'}</button>`;
            });
            html+=`${v>0?`<span style="font-size:12px;color:#888;margin-left:8px;align-self:center">${v}/5</span>`:''}
              </div>
              <div class="arch-desc">${esc(v>0?c.labels[v]:'tap a star to rate')}</div>
            </div>`;
          } else {
            const noC=!!c.noC;
            const s=l.scores[c.id]||'unknown';
            const dotCls=s==='a'?' dot-a':s==='b'?' dot-b':s==='c'?' dot-c':s==='d'?' dot-d':'';
            const dotLbl=s==='a'?'✓':s==='b'?'~':s==='c'?'✗':s==='d'?'✕':'';
            const tierText=s==='a'?c.a:s==='b'?c.b:s==='c'?c.c:s==='d'&&c.d?c.d:'tap to score';
            const tierCls=s==='a'?' t-a':s==='b'?' t-b':s==='c'?' t-c':s==='d'?' t-d':'';
            html+=`<button class="crit-cell" onclick="doCycle(${li},'${c.id}',${noC})">
              <div class="cell-top"><div class="dot${dotCls}">${dotLbl}</div><span class="cell-label">${esc(c.label)}</span></div>
              <div class="cell-tier${tierCls}">${esc(tierText)}</div>
            </button>`;
          }
        });
        html+='</div>';
      });

      html+=`<textarea class="notes-input" rows="2" placeholder="Notes…" oninput="listings[${li}].notes=this.value;saveListings()">${esc(l.notes||'')}</textarea>`;
    }

    html+='</div>';
  });

  container.innerHTML=html;
}

function toggleAllListings(){
  const anyExpanded=Object.keys(listingsCollapsed).length < listings.length ||
    listings.some((_,i)=>!listingsCollapsed[i]);
  listings.forEach((_,i)=>{listingsCollapsed[i]=anyExpanded;});
  renderListings();
}

function doCycle(li,cid,noC){
  const crit=CRITERIA.find(x=>x.id===cid);
  const states=noC?['unknown','a','b']:crit&&crit.hasD?['unknown','a','b','c','d']:['unknown','a','b','c'];
  const cur=listings[li].scores[cid]||'unknown';
  listings[li].scores[cid]=states[(states.indexOf(cur)+1)%states.length];
  saveListings();renderTabs();renderListings();
}

function doStar(li,cid,val){
  listings[li].scores[cid]=listings[li].scores[cid]===val?0:val;
  saveListings();renderTabs();renderListings();
}

function listingsClickHandler(){}
function listingsInputHandler(){}

let ddt=null;
function ddb(){clearTimeout(ddt);ddt=setTimeout(()=>{if(activeTab==='listings')renderListings();},300);}
function addListing(){listings.push(newListing());saveListings();renderListings();}
function delListing(i){listings.splice(i,1);expanded=null;saveListings();renderListings();}
function cycleScore(li,id,states){
  const cur=listings[li].scores[id]||'unknown';
  listings[li].scores[id]=states[(states.indexOf(cur)+1)%states.length];
  saveListings();renderListings();
}
function setS5(li,id,v){
  listings[li].scores[id]=listings[li].scores[id]===v?0:v;
  saveListings();renderListings();
}
function goEdit(idx){
  listingsCollapsed[idx]=false;
  showTab('listings');
  setTimeout(()=>{const el=document.getElementById('lc-'+idx);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},100);
}
(async()=>{
  try{await loadAllState();}catch(e){console.warn('loadAllState error:',e);}
  if(!listings.length){
    try{
      const r=await fetch('https://raw.githubusercontent.com/jpherron/jphousehunter/main/data.json');
      if(r.ok){
        const d=await r.json();
        listings=Array.isArray(d)?d:(d.listings||[]);
      }
    }catch(e){console.warn('data.json fetch failed:',e);}
  }
  document.getElementById('loading-screen').style.display='none';
  document.getElementById('app-root').style.display='';
  renderTabs();
  renderListings();
})();
</script>
</body>
</html>
